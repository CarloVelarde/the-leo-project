<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Starlink Edu — black field, constellation mark -->
  <rect width="32" height="32" rx="7" fill="#000000"/>

  <!-- Soft Earth disc -->
  <circle cx="16" cy="17" r="7" fill="#1a2744"/>
  <circle cx="16" cy="17" r="7" stroke="#3e6ae1" stroke-width="1.2"/>
  <!-- Terminator -->
  <path
    d="M16 10c1.85 1.55 2.85 3.6 2.85 7S17.85 22.45 16 24c-1.85-1.55-2.85-3.6-2.85-7S14.15 11.55 16 10Z"
    fill="#3e6ae1"
    opacity="0.35"
  />

  <!-- Inclined LEO shell -->
  <ellipse
    cx="16"
    cy="16"
    rx="13"
    ry="5.2"
    stroke="#6b8cff"
    stroke-width="1.15"
    opacity="0.95"
    transform="rotate(-38 16 16)"
  />

  <!-- Second shell (hint of multi-shell constellation) -->
  <ellipse
    cx="16"
    cy="16"
    rx="10.2"
    ry="3.6"
    stroke="#3e6ae1"
    stroke-width="0.9"
    opacity="0.55"
    transform="rotate(22 16 16)"
  />

  <!-- Bright white satellites — larger, with soft glow -->
  <g>
    <circle cx="26.8" cy="10.4" r="2.4" fill="#ffffff" opacity="0.18"/>
    <circle cx="26.8" cy="10.4" r="1.7" fill="#ffffff"/>
  </g>
  <g>
    <circle cx="6.4" cy="22.2" r="2.1" fill="#ffffff" opacity="0.16"/>
    <circle cx="6.4" cy="22.2" r="1.45" fill="#ffffff"/>
  </g>
  <g>
    <circle cx="21.2" cy="11.2" r="1.7" fill="#ffffff" opacity="0.14"/>
    <circle cx="21.2" cy="11.2" r="1.15" fill="#ffffff"/>
  </g>
  <g>
    <circle cx="9.6" cy="12.6" r="1.5" fill="#ffffff" opacity="0.12"/>
    <circle cx="9.6" cy="12.6" r="0.95" fill="#ffffff"/>
  </g>
</svg>
